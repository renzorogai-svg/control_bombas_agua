<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Bombas de Agua</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1b2a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 1.5rem;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      color: #4fc3f7;
      margin-bottom: 1.5rem;
      letter-spacing: .05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto 2rem;
    }

    .card {
      background: #1b2d42;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }

    .card h2 {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #78909c;
      margin-bottom: .75rem;
    }

    .level-value {
      font-size: 3rem;
      font-weight: 700;
      color: #4fc3f7;
      line-height: 1;
    }

    .level-bar-bg {
      width: 100%;
      height: 14px;
      background: #263545;
      border-radius: 7px;
      margin-top: .75rem;
      overflow: hidden;
    }

    .level-bar-fill {
      height: 100%;
      border-radius: 7px;
      background: linear-gradient(90deg, #0288d1, #4fc3f7);
      transition: width .5s ease;
    }

    .pump-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem 0;
      border-bottom: 1px solid #263545;
    }

    .pump-row:last-child { border-bottom: none; }

    .pump-name { font-size: .95rem; }

    .badge {
      font-size: .75rem;
      font-weight: 700;
      padding: .25rem .7rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .badge-on  { background: #1b5e20; color: #a5d6a7; }
    .badge-off { background: #263545; color: #78909c; }

    .alert-box {
      display: none;
      background: #7f0000;
      color: #ffcdd2;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      max-width: 900px;
      margin: 0 auto 1.5rem;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to   { opacity: .7; }
    }

    .timestamp {
      text-align: center;
      font-size: .75rem;
      color: #546e7a;
      margin-top: .5rem;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #1b2d42;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }

    .chart-container h2 {
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #78909c;
      margin-bottom: 1rem;
    }

    canvas { width: 100% !important; }
  </style>
</head>
<body>

<h1>💧 Control Bombas de Agua</h1>

<div id="alertBox" class="alert-box">⚠️ NIVEL BAJO — Se requiere atención inmediata</div>

<div class="grid">
  <div class="card">
    <h2>Nivel del Tanque</h2>
    <div class="level-value" id="levelValue">—</div>
    <div class="level-bar-bg">
      <div class="level-bar-fill" id="levelBar" style="width:0%"></div>
    </div>
  </div>

  <div class="card">
    <h2>Estado de las Bombas</h2>
    <div class="pump-row">
      <span class="pump-name">Bomba 1</span>
      <span class="badge badge-off" id="pump1Badge">OFF</span>
    </div>
    <div class="pump-row">
      <span class="pump-name">Bomba 2</span>
      <span class="badge badge-off" id="pump2Badge">OFF</span>
    </div>
  </div>
</div>

<div class="chart-container">
  <h2>Historial de Nivel (%)</h2>
  <canvas id="levelChart" height="120"></canvas>
</div>

<p class="timestamp" id="timestamp">Última actualización: —</p>

<!-- Micro chart using Canvas 2D (no external deps) -->
<script>
  const POLL_MS = 10000; // refresca cada 10 s

  async function fetchLatest() {
    try {
      const r = await fetch('/api/latest');
      return r.ok ? r.json() : null;
    } catch (_) { return null; }
  }

  async function fetchHistory(n = 60) {
    try {
      const r = await fetch(`/api/history?n=${n}`);
      return r.ok ? r.json() : [];
    } catch (_) { return []; }
  }

  function setBadge(el, on) {
    el.textContent = on ? 'ON' : 'OFF';
    el.className   = 'badge ' + (on ? 'badge-on' : 'badge-off');
  }

  function drawChart(canvas, data) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width  = canvas.offsetWidth;
    const H = canvas.height = 120;
    ctx.clearRect(0, 0, W, H);
    if (!data.length) return;

    const pad = 8;
    const step = (W - pad * 2) / Math.max(data.length - 1, 1);

    ctx.beginPath();
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth   = 2;
    ctx.lineJoin    = 'round';

    data.forEach((d, i) => {
      const x = pad + i * step;
      const y = H - pad - ((d.level_pct / 100) * (H - pad * 2));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // fill under line – build a new closed path
    ctx.beginPath();
    data.forEach((d, i) => {
      const x = pad + i * step;
      const y = H - pad - ((d.level_pct / 100) * (H - pad * 2));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.lineTo(pad + (data.length - 1) * step, H - pad);
    ctx.lineTo(pad, H - pad);
    ctx.closePath();
    ctx.fillStyle = 'rgba(79,195,247,.15)';
    ctx.fill();
  }

  async function refresh() {
    const [latest, hist] = await Promise.all([fetchLatest(), fetchHistory(60)]);

    if (latest) {
      const lvl = latest.level_pct;
      document.getElementById('levelValue').textContent = lvl.toFixed(1) + '%';
      document.getElementById('levelBar').style.width   = Math.max(0, Math.min(100, lvl)) + '%';
      setBadge(document.getElementById('pump1Badge'), latest.pump1);
      setBadge(document.getElementById('pump2Badge'), latest.pump2);

      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = latest.alert ? 'block' : 'none';

      document.getElementById('timestamp').textContent =
        'Última actualización: ' + new Date(latest.timestamp).toLocaleString();
    }

    drawChart(document.getElementById('levelChart'), hist);
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>
</body>
</html>
